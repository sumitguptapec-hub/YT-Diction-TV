<!doctype html>
<meta charset="utf-8">
<title>eruda import test (temporary)</title>
<pre id="log" style="font:13px monospace;white-space:pre-wrap"></pre>
<script type="module">
const log = (m) => { document.getElementById("log").textContent += m + "\n"; };
try {
  const mod = await import("https://cdn.jsdelivr.net/npm/eruda/+esm");
  log("import succeeded. keys: " + Object.keys(mod).join(", "));
  log("typeof mod.default: " + typeof mod.default);
  const eruda = mod.default;
  log("has init: " + (typeof eruda?.init));
  log("has show: " + (typeof eruda?.show));
  eruda.init();
  eruda.show("console");
  log("eruda.init() + show() ran without throwing");
  console.log("hello from inside eruda's own console panel");
} catch (err) {
  log("FAILED: " + err);
}
</script>
